name: frontend-release

# Section 3 (Frontend Pipeline): on every push to main that touches the apps, computes the next
# semantic version and publishes it as a git tag + GitHub Release. That release tag is what
# frontend-deploy-web.yml builds and deploys to S3 + CloudFront; the customer/restaurant/delivery
# apps ship as Capacitor mobile builds. No frontend container images are built or published —
# nothing deploys them (no EKS/ArgoCD, no ECR consumer), so the former per-app ECR build/scan/sign
# matrix and its development GitOps PR were retired.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "infrastructure/docker/**"
      - "infrastructure/kubernetes/**"
      - "pnpm-lock.yaml"

permissions:
  contents: write # git tag + GitHub Release

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One semver counter across all four apps (they live in one repo, one release) — matches
      # patheya-express-platform's backend-release.yml approach.
      - name: Compute next semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/(BREAKING CHANGE:|!:)/"
          minor_pattern: "/^feat(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - id: version
        run: echo "version=${{ steps.semver.outputs.version }}" >> "$GITHUB_OUTPUT"

  github-release:
    name: Tag + GitHub Release
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.semver }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes

  notify:
    name: Notify
    needs: [version, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: Patheya-express/patheya-express-platform/.github/actions/notify@main
        with:
          status: ${{ (contains(needs.*.result, 'failure') && 'failure') || 'success' }}
          title: "frontend-release: v${{ needs.version.outputs.semver }}"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          pagerduty-routing-key: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
