name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in sync with package.json's "packageManager" field manually — pnpm
  # has no native "read version from lockfile" action input, and corepack
  # reads package.json itself once checked out, so this only needs to match.
  PNPM_VERSION: 11.5.3
  NODE_VERSION: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sets NX_BASE/NX_HEAD correctly for both PR diffs and pushes to main
      # (plain `--base=origin/main` breaks on a push *to* main, since HEAD
      # is already on that branch and there'd be nothing to diff against).
      - uses: nrwl/nx-set-shas@v4
      - name: nx affected -- lint
        run: pnpm exec nx affected --target=lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: nx affected -- test
        run: pnpm exec nx affected --target=test --ci --coverage

  # Job id is `web-build`, not `build`, so its checks (`web-build (<app>)`) are unambiguous required
  # status check names.
  web-build:
    runs-on: ubuntu-latest
    strategy:
      # One app's failure must not cancel (and so hide) the other apps' results.
      fail-fast: false
      matrix:
        app: [customer-app, restaurant-app, admin-app, delivery-app]
    env:
      # CI-only validation value — NOT a credential. Exercises the real build-time injection path
      # (environment.prod.ts carries a placeholder that verify-production-env.mjs rejects). This
      # build is never uploaded or deployed, and verify-production-build.mjs --release (the deploy
      # gate in frontend-deploy-web.yml) rejects any bundle carrying it. The live key ID exists only
      # as the `production` environment's RAZORPAY_LIVE_KEY_ID secret.
      CI_RAZORPAY_LIVE_KEY_ID: rzp_live_CIVALIDATIONONLY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inject CI validation build-time configuration
        env:
          RAZORPAY_LIVE_KEY_ID: ${{ env.CI_RAZORPAY_LIVE_KEY_ID }}
        run: node scripts/inject-production-env.mjs ${{ matrix.app }}
      - name: Verify ${{ matrix.app }} production environment config
        run: node scripts/verify-production-env.mjs ${{ matrix.app }}
      - name: Build ${{ matrix.app }} (production configuration)
        run: pnpm exec nx build ${{ matrix.app }} --configuration=production
      - name: Verify ${{ matrix.app }} production build output
        run: node scripts/verify-production-build.mjs ${{ matrix.app }}

  # Compiles each Capacitor Android shell exactly as a developer would (mobile build + cap sync +
  # Gradle debug build) so native/plugin/Gradle regressions surface in CI. Debug only: release
  # builds require signing secrets and refuse to fall back to the debug key — see
  # docs/mobile/README.md. iOS needs a macOS runner and Apple signing, so it is not built here.
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-app, restaurant-app, delivery-app]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build + Capacitor sync ${{ matrix.app }} (mobile configuration)
        run: pnpm exec nx run ${{ matrix.app }}:cap-sync --configuration=mobile
      - name: Gradle assembleDebug (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon
