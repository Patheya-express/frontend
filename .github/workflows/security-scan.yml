name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catches newly-disclosed CVEs in already-merged dependencies/images,
    # not just ones introduced by a new PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Informational (`|| true`): the dependency tree has not been triaged against this gate yet
      # (2026-10-06: 87 high / 2 critical advisories reported), so failing on it would block
      # unrelated PRs. Tighten to a hard failure once the current findings are resolved.
      - run: pnpm audit --audit-level=high || true

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Pinned to the commit of the immutable v0.36.0 release (0.28.0 no longer resolves).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  # No image scan: the frontend ships no container images (Production is a static S3 + CloudFront
  # build — frontend-deploy-web.yml), so the filesystem scan above is the only Trivy scan.
