<button
  type="button"
  class="mobile-icon-button"
  [class.mobile-icon-button--sm]="size() === 'sm'"
  [class.mobile-icon-button--lg]="size() === 'lg'"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() || null"
  [mobileRipple]="!disabled() && !loading()"
  (click)="handleClick()"
>
  @if (loading()) {
    <span class="mobile-spinner" aria-hidden="true"></span>
  } @else {
    <ng-content />
  }
</button>
