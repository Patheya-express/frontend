<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  @if (errorMessage) {
    <div class="form-alert" role="alert">{{ errorMessage }}</div>
  }

  <p class="form-required-legend">
    <span class="form-required" aria-hidden="true">*</span> Required
  </p>

  <div class="form-field">
    <label for="forgot-password-email"
      >Email<span class="form-required" aria-hidden="true">*</span></label
    >
    <input
      id="forgot-password-email"
      type="email"
      autocomplete="email"
      inputmode="email"
      placeholder="Enter the email address you registered with"
      required
      formControlName="email"
      [class.invalid]="
        form.controls.email.invalid && form.controls.email.touched
      "
      [attr.aria-invalid]="
        form.controls.email.invalid && form.controls.email.touched ? true : null
      "
      [attr.aria-describedby]="
        form.controls.email.invalid && form.controls.email.touched
          ? 'forgot-password-email-error'
          : null
      "
    />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <span id="forgot-password-email-error" class="form-field-error">
        {{
          form.controls.email.hasError('required')
            ? 'Email is required.'
            : 'Enter a valid email address.'
        }}
      </span>
    }
  </div>

  <lib-primary-button
    type="submit"
    class="form-submit"
    [disabled]="loading"
    [loading]="loading"
  >
    {{ loading ? 'Sending…' : 'Send reset link' }}
  </lib-primary-button>
</form>
