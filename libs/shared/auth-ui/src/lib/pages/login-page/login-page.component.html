<lib-auth-layout [brandName]="brandName">
  <lib-auth-card title="Welcome back" subtitle="Log in to continue to {{ brandName }}">
    <lib-login-form
      [loading]="loading()"
      [errorMessage]="error()"
      [initialEmail]="rememberedEmail"
      (submitted)="onSubmit($event)"
    />
    <a class="forgot-password-link" routerLink="/auth/forgot-password" [queryParams]="redirectToQueryParams">Forgot password?</a>
    @if (registerCta) {
      <span auth-card-footer>Don't have an account? <a [routerLink]="registerCta.path" [queryParams]="redirectToQueryParams">{{ registerCta.label }}</a></span>
    }
  </lib-auth-card>
</lib-auth-layout>
