@if (visible()) {
  <div
    class="checkout-bar"
    [class.checkout-bar--native]="isNative"
    [class.mobile-anim-fab-enter]="shouldShow()"
    [class.mobile-anim-fab-leave]="!shouldShow()"
  >
    <span class="checkout-bar-summary">
      {{ totalItems() }} {{ totalItems() === 1 ? 'item' : 'items' }} · ₹{{ subtotal() }}
    </span>
    <a routerLink="/checkout" class="checkout-bar-action">Proceed to Checkout</a>
  </div>
}
