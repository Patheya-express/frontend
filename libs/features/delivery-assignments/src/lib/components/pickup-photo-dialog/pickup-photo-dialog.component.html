@if (displayDialog(); as dialog) {
  <lib-confirm-dialog
    [open]="!!facade.pickupPhotoDialog()"
    title="Pickup verification"
    message="Take a clear photo of the parcel before leaving the restaurant."
    [confirmLabel]="dialog.uploading ? 'Uploading…' : 'Submit photo'"
    cancelLabel="Cancel"
    [busy]="dialog.uploading"
    [confirmDisabled]="!dialog.file"
    (confirmed)="submit()"
    (cancelled)="close()"
  >
    <div dialogContent>
      <lib-file-upload
        accept="image/png,image/jpeg,image/webp"
        capture="environment"
        label="Take photo"
        ariaLabel="Take or upload parcel photo"
        [uploading]="dialog.uploading"
        [previewUrl]="dialog.previewUrl ?? undefined"
        [selectedFileName]="dialog.file?.name"
        (fileSelected)="onFileSelected($event)"
      />

      @if (dialog.error) {
        <p class="pickup-photo-dialog-error">{{ dialog.error }}</p>
      }
    </div>
  </lib-confirm-dialog>
}
