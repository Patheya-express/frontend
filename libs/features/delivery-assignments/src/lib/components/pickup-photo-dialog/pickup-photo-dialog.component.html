@if (displayDialog(); as dialog) {
  <lib-confirm-dialog
    [open]="!!facade.pickupPhotoDialog()"
    title="Parcel photo"
    message="Take a clear photo of the sealed parcel before you leave the restaurant. It is kept as a reference for this order — the customer does not need to approve it."
    [confirmLabel]="dialog.uploading ? 'Uploading…' : 'Submit photo'"
    cancelLabel="Cancel"
    [busy]="dialog.uploading"
    [confirmDisabled]="!dialog.file"
    (confirmed)="submit()"
    (cancelled)="close()"
  >
    <div dialogContent>
      <lib-file-upload
        accept="image/png,image/jpeg,image/webp"
        capture="environment"
        label="Take photo"
        [hint]="limitsHint"
        ariaLabel="Take or upload parcel photo"
        [uploading]="dialog.uploading"
        [previewUrl]="dialog.previewUrl ?? undefined"
        [selectedFileName]="dialog.file?.name"
        (fileSelected)="onFileSelected($event)"
      />

      @if (dialog.error) {
        <p class="pickup-photo-dialog-error" role="alert">{{ dialog.error }}</p>
      }
    </div>
  </lib-confirm-dialog>
}
