<lib-file-upload
  [customPreview]="true"
  align="center"
  label="Change photo"
  ariaLabel="Upload profile photo"
  [uploading]="uploading"
  (fileSelected)="fileSelected.emit($event)"
>
  <div filePreview class="avatar-circle">
    @if (resolvedAvatarUrl(); as url) {
      <img [src]="url" alt="Your profile photo" />
    } @else {
      <span class="avatar-initials" aria-hidden="true">{{ initials() }}</span>
    }
  </div>
</lib-file-upload>
